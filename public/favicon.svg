<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="grad-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Plate -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#05070a" stroke="#1e293b" stroke-width="2"/>

  <!-- Outer Pin Bus Lines -->
  <line x1="32" y1="4" x2="32" y2="14" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="32" y1="50" x2="32" y2="60" stroke="#00e5ff" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="4" y1="32" x2="14" y2="32" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <line x1="50" y1="32" x2="60" y2="32" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>

  <!-- Diagonal Circuit Traces -->
  <path d="M14 14 L20 20" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M50 14 L44 20" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M14 50 L20 44" stroke="#7c3aed" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  <path d="M50 50 L44 44" stroke="#00e5ff" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

  <!-- Silicon Die Core -->
  <rect x="18" y="18" width="28" height="28" rx="6" fill="#0b1117" stroke="url(#grad-core)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- Microarchitecture Logic Gates / Switch Core -->
  <rect x="23" y="23" width="8" height="8" rx="2" fill="#00e5ff" opacity="0.9"/>
  <rect x="33" y="23" width="8" height="8" rx="2" fill="#7c3aed" opacity="0.9"/>
  <rect x="23" y="33" width="8" height="8" rx="2" fill="#7c3aed" opacity="0.9"/>
  <rect x="33" y="33" width="8" height="8" rx="2" fill="#00e5ff" opacity="0.9"/>

  <!-- Center Nano Quantum Dot -->
  <circle cx="32" cy="32" r="2.5" fill="#ffffff"/>
</svg>